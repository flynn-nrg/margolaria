# project.yml
#
# XcodeGen specification for Margolaria.xcodeproj. The .xcodeproj is generated
# from this file and is git-ignored; never edit it by hand. After changing this
# file, or adding or removing source files, regenerate it with:
#
#     xcodegen
#
# Build settings do NOT live here. They are in Config/*.xcconfig, which review
# better and are the same files Xcode itself understands. This file only says
# which targets exist, where their sources are and what they depend on.
#
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Margolaria

options:
  # XcodeGen can fill in default build settings ("presets"). "project" keeps
  # only its project-level defaults (Debug/Release optimisation levels, warning
  # flags) and skips its target-level ones, so every target setting comes from
  # our xcconfig files and nothing is set behind our backs.
  settingPresets: project
  # Mirror the folder structure as groups in Xcode's navigator.
  createIntermediateGroups: true

# Local Swift packages. MargolariaKit holds all our code that talks to OpenUSD,
# MaterialX and OpenColorIO: MXKit (MaterialX), ViewportKit (the Storm
# viewport), ColorKit (OCIO) and more. It depends on the SwiftUsd copy in
# Vendor/SwiftUsd and the OCIO framework in Vendor/OpenColorIO; run
# scripts/fetch-swiftusd.sh and scripts/build-ocio.sh before the first build.
packages:
  MargolariaKit:
    path: Packages/MargolariaKit

targets:
  Margolaria:
    type: application
    platform: macOS
    sources:
      - path: App
    # All build settings for this target, including signing (Config/Base.xcconfig).
    configFiles:
      Debug: Config/Margolaria.xcconfig
      Release: Config/Margolaria.xcconfig
    dependencies:
      - package: MargolariaKit
        product: MXKit
      - package: MargolariaKit
        product: GraphKit
      - package: MargolariaKit
        product: ViewportKit
      - package: MargolariaKit
        product: ColorKit
      - package: MargolariaKit
        product: PreviewKit
    # Generate a shared scheme, so `xcodebuild -scheme Margolaria` works.
    # Its Test action runs the package's tests in the same build folder as
    # the app, so `xcodebuild test -scheme Margolaria` reuses the app's build
    # instead of compiling everything again (which `swift test` would do).
    scheme:
      testTargets:
        - package: MargolariaKit/MXKitTests
        - package: MargolariaKit/ViewportKitTests
        - package: MargolariaKit/PreviewKitTests
        - package: MargolariaKit/GraphKitTests
        - package: MargolariaKit/ColorKitTests

  # Spike M0b: a one-window demo of the Storm viewport (docs/spikes/M0b-storm-viewport.md).
  # The .mtlx next to the source is copied into the app's resources.
  ViewportSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/M0bViewport
    configFiles:
      Debug: Config/ViewportSpike.xcconfig
      Release: Config/ViewportSpike.xcconfig
    dependencies:
      - package: MargolariaKit
        product: ViewportKit
    scheme: {}

  # Spike M0c: swatches from MaterialX's generated MSL (docs/spikes/M0c-msl-swatch.md).
  SwatchSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/M0cSwatches
    configFiles:
      Debug: Config/SwatchSpike.xcconfig
      Release: Config/SwatchSpike.xcconfig
    dependencies:
      - package: MargolariaKit
        product: MXKit
      - package: MargolariaKit
        product: PreviewKit
    scheme: {}

  # Spike M0d: graph canvas renderers and benchmark (docs/spikes/M0d-graph-canvas.md).
  GraphSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/M0dGraphCanvas
    configFiles:
      Debug: Config/GraphSpike.xcconfig
      Release: Config/GraphSpike.xcconfig
    dependencies:
      - package: MargolariaKit
        product: GraphKit
    scheme: {}
